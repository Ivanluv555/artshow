spring:
  application:
    name: artshow

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}

    properties:
      hibernate:
        "[format_sql]": true
        dialect: org.hibernate.dialect.MariaDBDialect

  datasource:
    url: ${DB_URL:jdbc:mysql://47.237.188.77:3306/artshow?serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:WaterChina@242526}

  jackson:
    mapper:
      accept-case-insensitive-properties: true

  # Redis configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

server:
  port: 8888
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# JWT
jwt:
  secret: ${JWT_SECRET:artshow_local_dev_secret_key_must_be_very_long_123456789}

# Logging configuration
logging:
  charset:
    console: UTF-8
    file: UTF-8

# SpringDoc OpenAPI configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    version: 3.52.5
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
